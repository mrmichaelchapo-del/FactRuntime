<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>FactRuntime Editor</title>
<style>
.more-btn{background:transparent;color:#ccc;border:0;padding:4px 8px;font-size:16px;cursor:pointer;border-radius:4px}.more-btn:hover{background:#2a2d2e;color:white}.tools-menu{display:none;position:absolute;background:#252526;border:1px solid #454545;min-width:160px;z-index:1000}.tools-menu button{display:block;width:100%;padding:8px 12px;background:transparent;border:0;color:#ccc;text-align:left;cursor:pointer}.tools-menu button:hover{background:#094771;color:white}.tools-menu.show{display:block}
#ai-bot button{background:blue;color:white;border:0;padding:8px 12px;cursor:pointer}#ai-bot img{width:20px;height:20px;vertical-align:middle}.ai-modal{display:none;position:fixed;inset:0;z-index:99999;background:#000a;align-items:center;justify-content:center;font-family:Arial,sans-serif}.ai-box{width:min(720px,92vw);background:#252526;color:white;border:1px solid #444;border-radius:8px;overflow:hidden;box-shadow:0 20px 60px #0008}.ai-header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid #444}.ai-header b,.ai-header small{display:block}.ai-header small{margin-top:4px;color:#999}.ai-header button{border:0;background:none;color:#aaa;font-size:24px;cursor:pointer}.ai-body{padding:16px}.ai-body label{display:block;margin-bottom:7px;color:#ccc;font-size:13px}
#ai-request{width:100%;min-height:90px;box-sizing:border-box;resize:vertical;padding:10px;background:#1e1e1e;color:white;border:1px solid #444;border-radius:5px;outline:none;font-family:Consolas,monospace}#ai-request:focus{border-color:#007acc}.fix-button,.apply-button{margin-top:10px;padding:9px 15px;border:0;border-radius:5px;background:#007acc;color:white;cursor:pointer}.fix-button:hover,.apply-button:hover{background:#1689d8}#ai-status{margin-top:10px;color:#aaa;font-size:13px}#ai-preview{margin-top:18px}#ai-code{display:block;max-height:300px;overflow:auto;padding:12px;background:#181818;border:1px solid #444;border-radius:5px;color:#ddd;font-family:Consolas,monospace;white-space:pre-wrap}.ai-actions{display:flex;justify-content:flex-end;gap:8px}.ai-actions button{padding:8px 13px;border:0;border-radius:5px;background:#3a3a3a;color:white;cursor:pointer}.ai-actions .apply-button{background:#168544}
</style>
</head>
<body>
<nav class="navbar"><img src="src/img/logo.png"><div class="nav-links"><a href="#">Home</a><a href="/pricing">Pricing</a><button class="more-btn" id="moreBtn">...</button><div class="tools-menu" id="toolsMenu"><button onclick="findJS()">Find</button><button onclick="focusJS()">Focus Editor</button><button onclick="clearJS()">Clear</button></div><a href="/download">Download</a></div></nav>
<div id="js-editor"><textarea placeholder="// Example code:
sprite.say(&quot;Hello world!&quot;)"></textarea></div><div id="ai-bot"><button onclick="openAIModal()"><img src="src/img/robot.png" alt="AI Assistant"> AI Assistant</button></div>
<div id="ai-modal" class="ai-modal"><div class="ai-box"><div class="ai-header"><div><b>🤖 AI Assistant</b><small>Fix JavaScript generated from Scratch</small></div><button onclick="closeAIModal()">×</button></div><div class="ai-body"><label>What should I fix?</label><textarea id="ai-request" placeholder="Example: Fix the sprite movement"></textarea><button class="fix-button" onclick="fixJSCode()">Fix Code</button><div id="ai-status"></div><div id="ai-preview" hidden><label>AI-fixed code</label><pre><code id="ai-code"></code></pre><div class="ai-actions"><button onclick="closeAIModal()">Cancel</button><button class="apply-button" onclick="applyAICode()">Apply Fix</button></div></div></div></div></div>
<script>
const moreBtn=document.getElementById("moreBtn"),toolsMenu=document.getElementById("toolsMenu");moreBtn.onclick=()=>toolsMenu.classList.toggle("show");document.addEventListener("click",e=>{if(!moreBtn.contains(e.target)&&!toolsMenu.contains(e.target))toolsMenu.classList.remove("show")});const getJSEditor=()=>document.querySelector("#js-editor");
function focusJS(){const e=getJSEditor(),t=e?.querySelector("textarea");if(!e)return alert('No element with id="js-editor" was found.');(t||e).focus()}
function findJS(){const e=getJSEditor();if(!e)return alert('No element with id="js-editor" was found.');const s=prompt("Find in JavaScript:");if(!s)return;const t=e.querySelector("textarea"),x=t?t.value:e.textContent||"";alert(x.toLowerCase().includes(s.toLowerCase())?`Found "${s}".`:`"${s}" was not found.`)}
function clearJS(){const e=getJSEditor(),t=e?.querySelector("textarea");if(!e)return alert('No element with id="js-editor" was found.');if(t){t.value="";t.dispatchEvent(new Event("input",{bubbles:true}));t.focus()}}
function openAIModal(){if(!getJSEditor())return alert('Could not find <div id="js-editor">.');document.getElementById("ai-modal").style.display="flex";document.getElementById("ai-request").focus()}function closeAIModal(){document.getElementById("ai-modal").style.display="none"}
function getJSFromEditor(){const e=getJSEditor(),t=e?.querySelector("textarea"),c=e?.querySelector(".CodeMirror"),m=e?.querySelector(".monaco-editor"),q=e?.querySelector("[contenteditable='true']");if(!e)throw Error('Could not find <div id="js-editor">.');if(t)return t.value;if(q)return q.innerText;if(c?.CodeMirror)return c.CodeMirror.getValue();if(window.monaco&&m){const x=monaco.editor.getModels();if(x.length)return x[0].getValue()}throw Error("Found #js-editor, but no supported code editor was found inside it.")}
function setJSInEditor(x){const e=getJSEditor(),t=e?.querySelector("textarea"),q=e?.querySelector("[contenteditable='true']"),c=e?.querySelector(".CodeMirror"),m=e?.querySelector(".monaco-editor");if(!e)throw Error('Could not find <div id="js-editor">.');if(t){t.value=x;t.dispatchEvent(new Event("input",{bubbles:true}));t.dispatchEvent(new Event("change",{bubbles:true}));return}if(q){q.innerText=x;q.dispatchEvent(new InputEvent("input",{bubbles:true,inputType:"insertText",data:x}));return}if(c?.CodeMirror)return c.CodeMirror.setValue(x);if(window.monaco&&m){const z=monaco.editor.getModels();if(z.length)return z[0].setValue(x)}throw Error("Could not write the fixed code into #js-editor.")}
let pendingAICode="";
async function fixJSCode(){const r=document.getElementById("ai-request").value.trim(),s=document.getElementById("ai-status"),p=document.getElementById("ai-preview");if(!r)return s.textContent="Describe what you want fixed.";let c;try{c=getJSFromEditor()}catch(e){return s.textContent=e.message}s.textContent="AI is analyzing the JavaScript...";p.hidden=true;try{const x=await fetch("/api/ai/fix-code",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({request:r,code:c,language:"javascript",source:"scratch-to-js"})});if(!x.ok)throw Error("AI request failed: HTTP "+x.status);const d=await x.json();if(!d.code)throw Error("The AI did not return corrected JavaScript.");pendingAICode=d.code;document.getElementById("ai-code").textContent=d.code;p.hidden=false;s.textContent="Fix ready. Review it before applying."}catch(e){s.textContent=e.message}}
function applyAICode(){if(!pendingAICode)return;try{setJSInEditor(pendingAICode);document.getElementById("ai-status").textContent="Fix applied to #js-editor.";setTimeout(closeAIModal,500)}catch(e){document.getElementById("ai-status").textContent=e.message}}
</script>

<p>Go to the guide for project syntax on FactRuntime project JS!</p>

<button>Download Compiled</button>

<script src="src/downloaders/utils/download.js"></script>
</body>
</html>
