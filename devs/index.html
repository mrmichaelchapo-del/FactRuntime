<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FactRuntime Editor</title>

  <style>
    .more-btn {
      background: transparent;
      color: #ccc;
      border: 0;
      padding: 4px 8px;
      font-size: 16px;
      cursor: pointer;
      border-radius: 4px;
    }

    .more-btn:hover {
      background: #2a2d2e;
      color: white;
    }

    .tools-menu {
      display: none;
      position: absolute;
      background: #252526;
      border: 1px solid #454545;
      min-width: 160px;
      z-index: 1000;
    }

    .tools-menu button {
      display: block;
      width: 100%;
      padding: 8px 12px;
      background: transparent;
      border: 0;
      color: #ccc;
      text-align: left;
      cursor: pointer;
    }

    .tools-menu button:hover {
      background: #094771;
      color: white;
    }

    .tools-menu.show {
      display: block;
    }

    /* AI button */
    #ai-bot button {
      background: blue;
      color: white;
      border: 0;
      padding: 8px 12px;
      cursor: pointer;
    }

    #ai-bot img {
      width: 20px;
      height: 20px;
      vertical-align: middle;
    }

    /* AI modal */
    .ai-modal {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 99999;
      background: rgba(0, 0, 0, .65);
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
    }

    .ai-box {
      width: min(720px, 92vw);
      background: #252526;
      color: white;
      border: 1px solid #444;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 20px 60px #0008;
    }

    .ai-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px;
      border-bottom: 1px solid #444;
    }

    .ai-header b {
      display: block;
    }

    .ai-header small {
      display: block;
      margin-top: 4px;
      color: #999;
    }

    .ai-header button {
      border: 0;
      background: none;
      color: #aaa;
      font-size: 24px;
      cursor: pointer;
    }

    .ai-body {
      padding: 16px;
    }

    .ai-body label {
      display: block;
      margin-bottom: 7px;
      color: #ccc;
      font-size: 13px;
    }

    #ai-request {
      width: 100%;
      min-height: 90px;
      box-sizing: border-box;
      resize: vertical;
      padding: 10px;
      background: #1e1e1e;
      color: white;
      border: 1px solid #444;
      border-radius: 5px;
      outline: none;
      font-family: Consolas, monospace;
    }

    #ai-request:focus {
      border-color: #007acc;
    }

    .fix-button,
    .apply-button {
      margin-top: 10px;
      padding: 9px 15px;
      border: 0;
      border-radius: 5px;
      background: #007acc;
      color: white;
      cursor: pointer;
    }

    .fix-button:hover,
    .apply-button:hover {
      background: #1689d8;
    }

    #ai-status {
      margin-top: 10px;
      color: #aaa;
      font-size: 13px;
    }

    #ai-preview {
      margin-top: 18px;
    }

    #ai-code {
      display: block;
      max-height: 300px;
      overflow: auto;
      padding: 12px;
      background: #181818;
      border: 1px solid #444;
      border-radius: 5px;
      color: #ddd;
      font-family: Consolas, monospace;
      white-space: pre-wrap;
    }

    .ai-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }

    .ai-actions button {
      padding: 8px 13px;
      border: 0;
      border-radius: 5px;
      background: #3a3a3a;
      color: white;
      cursor: pointer;
    }

    .ai-actions .apply-button {
      background: #168544;
    }
  </style>
</head>

<body>

<nav class="navbar">
  <img src="src/img/logo.png">

  <div class="nav-links">
    <a href="#">Home</a>
    <a href="/pricing">Pricing</a>

    <button class="more-btn" id="moreBtn">...</button>

    <div class="tools-menu" id="toolsMenu">
      <button onclick="findJS()">Find</button>
      <button onclick="focusJS()">Focus Editor</button>
      <button onclick="clearJS()">Clear</button>
    </div>

    <a href="/download">Download</a>
  </div>
</nav>

<div id="js-editor">
  <textarea placeholder="// Example code:
sprite.say(&quot;Hello world!&quot;)"></textarea>
</div>

<div id="ai-bot">
  <button onclick="openAIModal()">
    <img src="src/img/robot.png" alt="AI Assistant">
    AI Assistant
  </button>
</div>


<!-- AI Assistant Modal -->
<div id="ai-modal" class="ai-modal">
  <div class="ai-box">

    <div class="ai-header">
      <div>
        <b>🤖 AI Assistant</b>
        <small>Fix JavaScript generated from Scratch</small>
      </div>

      <button onclick="closeAIModal()">×</button>
    </div>

    <div class="ai-body">

      <label>What should I fix?</label>

      <textarea
        id="ai-request"
        placeholder="Example: Fix the sprite movement"
      ></textarea>

      <button class="fix-button" onclick="fixJSCode()">
        Fix Code
      </button>

      <div id="ai-status"></div>

      <div id="ai-preview" hidden>

        <label>AI-fixed code</label>

        <pre><code id="ai-code"></code></pre>

        <div class="ai-actions">

          <button onclick="closeAIModal()">
            Cancel
          </button>

          <button
            class="apply-button"
            onclick="applyAICode()">
            Apply Fix
          </button>

        </div>
      </div>
    </div>
  </div>
</div>


<script>
const moreBtn = document.getElementById("moreBtn");
const toolsMenu = document.getElementById("toolsMenu");

moreBtn.onclick = () => {
  toolsMenu.classList.toggle("show");
};


function getJSEditor() {
  return document.querySelector("#js-editor");
}


function focusJS() {
  const editor = getJSEditor();

  if (!editor) {
    alert('No element with id="js-editor" was found.');
    return;
  }

  const textarea = editor.querySelector("textarea");

  if (textarea) {
    textarea.focus();
  } else {
    editor.focus();
  }
}


function findJS() {
  const editor = getJSEditor();

  if (!editor) {
    alert('No element with id="js-editor" was found.');
    return;
  }

  const search = prompt("Find in JavaScript:");

  if (!search) return;

  const textarea = editor.querySelector("textarea");

  const text = textarea
    ? textarea.value
    : editor.textContent || "";

  if (text.toLowerCase().includes(search.toLowerCase())) {
    alert(`Found "${search}".`);
  } else {
    alert(`"${search}" was not found.`);
  }
}


function clearJS() {
  const editor = getJSEditor();

  if (!editor) {
    alert('No element with id="js-editor" was found.');
    return;
  }

  const textarea = editor.querySelector("textarea");

  if (textarea) {
    textarea.value = "";

    textarea.dispatchEvent(
      new Event("input", {
        bubbles: true
      })
    );

    textarea.focus();
  }
}


document.addEventListener("click", event => {
  if (
    !moreBtn.contains(event.target) &&
    !toolsMenu.contains(event.target)
  ) {
    toolsMenu.classList.remove("show");
  }
});


/* =========================
   AI ASSISTANT
========================= */

let pendingAICode = "";


function openAIModal() {
  const editor = document.getElementById("js-editor");

  if (!editor) {
    alert('Could not find <div id="js-editor">.');
    return;
  }

  document.getElementById("ai-modal").style.display = "flex";
  document.getElementById("ai-request").focus();
}


function closeAIModal() {
  document.getElementById("ai-modal").style.display = "none";
}


function getJSFromEditor() {
  const editor = document.getElementById("js-editor");

  if (!editor) {
    throw new Error(
      'Could not find <div id="js-editor">.'
    );
  }

  const textarea = editor.querySelector("textarea");

  if (textarea) {
    return textarea.value;
  }

  const editable = editor.querySelector(
    "[contenteditable='true']"
  );

  if (editable) {
    return editable.innerText;
  }

  if (editor.querySelector(".CodeMirror")) {
    const cm = editor.querySelector(".CodeMirror");

    if (cm.CodeMirror) {
      return cm.CodeMirror.getValue();
    }
  }

  if (window.monaco) {
    const monacoEditor =
      editor.querySelector(".monaco-editor");

    if (monacoEditor) {
      const models =
        window.monaco.editor.getModels();

      if (models.length) {
        return models[0].getValue();
      }
    }
  }

  throw new Error(
    "Found #js-editor, but no supported code editor was found inside it."
  );
}


function setJSInEditor(code) {
  const editor = document.getElementById("js-editor");

  if (!editor) {
    throw new Error(
      'Could not find <div id="js-editor">.'
    );
  }

  const textarea = editor.querySelector("textarea");

  if (textarea) {
    textarea.value = code;

    textarea.dispatchEvent(
      new Event("input", {
        bubbles: true
      })
    );

    textarea.dispatchEvent(
      new Event("change", {
        bubbles: true
      })
    );

    return;
  }

  const editable = editor.querySelector(
    "[contenteditable='true']"
  );

  if (editable) {
    editable.innerText = code;

    editable.dispatchEvent(
      new InputEvent("input", {
        bubbles: true,
        inputType: "insertText",
        data: code
      })
    );

    return;
  }

  if (editor.querySelector(".CodeMirror")) {
    const cm = editor.querySelector(".CodeMirror");

    if (cm.CodeMirror) {
      cm.CodeMirror.setValue(code);
      return;
    }
  }

  if (window.monaco) {
    const monacoEditor =
      editor.querySelector(".monaco-editor");

    if (monacoEditor) {
      const models =
        window.monaco.editor.getModels();

      if (models.length) {
        models[0].setValue(code);
        return;
      }
    }
  }

  throw new Error(
    "Could not write the fixed code into #js-editor."
  );
}


async function fixJSCode() {
  const request =
    document.getElementById("ai-request").value.trim();

  const status =
    document.getElementById("ai-status");

  const preview =
    document.getElementById("ai-preview");

  if (!request) {
    status.textContent =
      "Describe what you want fixed.";
    return;
  }

  let currentCode;

  try {
    currentCode = getJSFromEditor();
  } catch (error) {
    status.textContent = error.message;
    return;
  }

  status.textContent =
    "AI is analyzing the JavaScript...";

  preview.hidden = true;

  try {
    const response = await fetch(
      "/api/ai/fix-code",
      {
        method: "POST",

        headers: {
          "Content-Type": "application/json"
        },

        body: JSON.stringify({
          request: request,
          code: currentCode,
          language: "javascript",
          source: "scratch-to-js"
        })
      }
    );

    if (!response.ok) {
      throw new Error(
        "AI request failed: HTTP " +
        response.status
      );
    }

    const data = await response.json();

    if (!data.code) {
      throw new Error(
        "The AI did not return corrected JavaScript."
      );
    }

    pendingAICode = data.code;

    document.getElementById(
      "ai-code"
    ).textContent = pendingAICode;

    preview.hidden = false;

    status.textContent =
      "Fix ready. Review it before applying.";

  } catch (error) {
    status.textContent = error.message;
  }
}


function applyAICode() {
  if (!pendingAICode) {
    return;
  }

  try {
    setJSInEditor(pendingAICode);

    document.getElementById(
      "ai-status"
    ).textContent =
      "Fix applied to #js-editor.";

    setTimeout(
      closeAIModal,
      500
    );

  } catch (error) {
    document.getElementById(
      "ai-status"
    ).textContent =
      error.message;
  }
}
</script>

</body>
</html>
